<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      body{margin:0;padding:0;background:#0b0f1a;color:#e6e6f0;font-family:Arial,Helvetica,sans-serif;}
      .wrap{max-width:640px;margin:0 auto;background:#0e1324 linear-gradient(180deg,rgba(93,53,151,.25),rgba(7,15,36,.45));border:1px solid #26304a;border-radius:14px;overflow:hidden}
      .hdr{padding:18px 22px;background:linear-gradient(90deg,#6d28d9,#22d3ee);color:#fff;font-weight:700;letter-spacing:.5px}
      .brand{font-size:18px}
      .content{padding:24px}
      .footer{padding:16px 22px;color:#a0a8c0;font-size:12px;border-top:1px solid #26304a}
      a{color:#93c5fd}
      .btn{display:inline-block;background:#6d28d9;color:#fff !important;padding:10px 16px;border-radius:8px;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hdr"><span class="brand">ANOINT ARRAY</span></div>
      <div class="content">
        {{content}}
      </div>
      <div class="footer">
        © {{year}} ANOINT ARRAY • Sent with love from the aurora
      </div>
    </div>
  </body>
</html>
